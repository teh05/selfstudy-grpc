[package]
name = "selfstudy-grpc"
version = "0.1.0"
edition = "2021"
description = "Mini bank gRPC simulator for learning tonic"

[[bin]]
name = "bank-server"
path = "src/bin/server.rs"

[[bin]]
name = "bank-client"
path = "src/bin/client.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
anyhow = "1"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
